# Dynamic Difficulty
# .gamedifficulty 0..100 interpolates every Min/Max pair.
# With multiple real players, the highest difficulty wins.
# "WithBots" = at least one online PlayerBot in the victim's group.

DynamicDifficulty.Enable = 1
DynamicDifficulty.DefaultDifficulty = 0
DynamicDifficulty.AnnounceOnLogin = 1
DynamicDifficulty.Debug = 1
DynamicDifficulty.FinalMultiplierCap = 10.0

DynamicDifficulty.Outdoor.WithBots.Damage.Min = 1.40
DynamicDifficulty.Outdoor.WithBots.Damage.Max = 2.00
DynamicDifficulty.Outdoor.WithBots.SpellDamage.Min = 1.40
DynamicDifficulty.Outdoor.WithBots.SpellDamage.Max = 2.00

DynamicDifficulty.Outdoor.WithoutBots.Damage.Min = 1.00
DynamicDifficulty.Outdoor.WithoutBots.Damage.Max = 1.70
DynamicDifficulty.Outdoor.WithoutBots.SpellDamage.Min = 1.00
DynamicDifficulty.Outdoor.WithoutBots.SpellDamage.Max = 1.70

