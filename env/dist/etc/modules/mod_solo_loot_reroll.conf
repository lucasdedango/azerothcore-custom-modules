[worldserver]

###################################################################################################
# mod-solo-loot-reroll
#
# Active when at least one eligible real player is available.
#
# With several real players, one eligible player is selected uniformly at random
# for each generated creature/boss loot.
#
# A player can opt out with:
#   .lootignore on
#
# That player is removed from the random selection until relog/restart or:
#   .lootignore off
#
# Player armor mode defaults to AUTO:
#   highest CURRENT armor proficiency (Plate > Mail > Leather > Cloth).
#
# Commands:
#   .loottypeset auto
#   .loottypeset off
#   .loottypeset tissu / cloth
#   .loottypeset cuir / leather
#   .loottypeset maille / mail
#   .loottypeset plaque / plate
#   .loottype
###################################################################################################

SoloLootReroll.Enable = 1

# Smart-reroll body armor (head/shoulders/chest/waist/legs/feet/wrists/hands/robes).
SoloLootReroll.EnableArmor = 1

# Smart-reroll weapons the real player cannot currently use.
SoloLootReroll.EnableWeapons = 1

# 2 = Uncommon (green). Values below 2 are clamped to 2.
SoloLootReroll.MinQuality = 2

# Green unsuitable items can be REPLACED by another usable green item
# reachable from the same creature/boss loot pool.
SoloLootReroll.ReplaceUncommon = 1

# Blue/epic/legendary/etc.: first try a compatible replacement of EXACTLY
# the same quality from the same creature/boss loot pool.
SoloLootReroll.ReplaceRareOrHigher = 1

# If no same-quality replacement exists, KEEP the original item and ADD the
# highest lower-quality compatible item available in the same pool.
# Examples: Epic -> Rare -> Uncommon ; Rare -> Uncommon.
SoloLootReroll.LowerQualityFallbackBonus = 1

# Verbose per-reroll logs.
SoloLootReroll.Debug = 0


# Affiche au joueur chaque remplacement/bonus avec liens d'objets et un ID SmartLoot.
SoloLootReroll.NotifySubstitutions = 1

# Nombre maximal de substitutions annulables conservees en memoire par personnage.
# Historique RAM uniquement : il disparait au redemarrage du worldserver.
SoloLootReroll.MaxUndoRecordsPerCharacter = 100
